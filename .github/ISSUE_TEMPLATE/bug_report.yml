name: Bug Report
description: Create a report to help us improve Yomira
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: e.g. Android 14
    validations:
      required: true
  - type: input
    id: device_model
    attributes:
      label: Device model
      placeholder: e.g. Samsung Galaxy S23
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source/Extension (if applicable)
      description: Mention the specific source if this bug is isolated to one extension.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots or videos to help explain your problem.
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any other context about the problem here.
